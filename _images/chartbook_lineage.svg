<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" width="960" height="410" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="currentColor" stroke="currentColor">
  <title>How ChartBook chains hashes across pipelines</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" stroke="none"/>
    </marker>
  </defs>
  <g fill="none" stroke-width="1.5">
    <rect x="10" y="40" width="290" height="224" rx="8"/>
    <rect x="340" y="40" width="270" height="224" rx="8"/>
    <rect x="650" y="40" width="300" height="224" rx="8"/>
  </g>
  <g stroke-width="0.8" stroke-dasharray="3 3">
    <line x1="22" y1="90" x2="288" y2="90"/>
    <line x1="352" y1="90" x2="598" y2="90"/>
    <line x1="662" y1="90" x2="938" y2="90"/>
    <line x1="662" y1="156" x2="938" y2="156"/>
  </g>
  <g stroke="none" font-weight="600">
    <text x="12" y="28">1. A snapshot of ftsfr/fed_yield_curve</text>
    <text x="342" y="28">2. my_report's chartbook.lock</text>
    <text x="652" y="28">3. A snapshot of my_report</text>
  </g>
  <g stroke="none" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10">
    <!-- box 1 -->
    <text x="22" y="62">name: 2026-11-02T052219Z_3904ad6</text>
    <text x="22" y="108">assets, each the sha256 of its bytes:</text>
    <text x="22" y="128">ftsfr_treas_yield_curve_zero_coupon</text>
    <text x="40" y="143">sha256:b63da040…</text>
    <text x="22" y="163">chart/yield_curve_replication</text>
    <text x="40" y="178">sha256:47cbb658…</text>
    <text x="22" y="198">notebook/summary_fed_yield_curve_ipynb</text>
    <text x="40" y="213">sha256:e7510339…</text>
    <text x="22" y="233">notebook/gsw_crsp_replication_ipynb</text>
    <text x="40" y="248">sha256:357c9890…</text>
    <!-- box 2 -->
    <text x="352" y="62">pins ftsfr/fed_yield_curve at</text>
    <text x="352" y="77">commit 3904ad6, snapshot 05:22:19Z</text>
    <text x="352" y="108">listing, one line per asset, sorted:</text>
    <text x="352" y="126">47cbb658…  chart/yield_curve_…</text>
    <text x="352" y="141">b63da040…  ftsfr_treas_yield_…</text>
    <text x="352" y="156">357c9890…  notebook/gsw_crsp_…</text>
    <text x="352" y="171">e7510339…  notebook/summary_…</text>
    <text x="352" y="198">pinned_hash = sha256(listing)</text>
    <text x="352" y="216" font-weight="600">= sha256:aff4ea7d…</text>
    <!-- box 3 -->
    <text x="662" y="62">name: 2026-11-10T140502Z_c0ffee1</text>
    <text x="662" y="108">built from (its lockfile's pins):</text>
    <text x="662" y="126">ftsfr/fed_yield_curve @ 3904ad6</text>
    <text x="680" y="141">pinned_hash sha256:aff4ea7d…</text>
    <text x="662" y="176">assets:</text>
    <text x="662" y="194">curve_summary      sha256:9c1e22a0…</text>
    <text x="662" y="212">chart/term_spread  sha256:0b8d41f7…</text>
  </g>
  <g stroke="none" font-size="10.5" font-style="italic">
    <text x="22" y="78">the commit and the time: not a hash</text>
    <text x="352" y="238">one hash for the whole dependency</text>
    <text x="662" y="238">a fourth pipeline pins this one the same way</text>
    <text x="320" y="135" text-anchor="middle">hash</text>
    <text x="630" y="135" text-anchor="middle">hash</text>
  </g>
  <g stroke-width="1.4" fill="none" marker-end="url(#arrow)">
    <line x1="302" y1="145" x2="338" y2="145"/>
    <line x1="612" y1="145" x2="648" y2="145"/>
  </g>
  <g stroke="none" font-size="11.5">
    <text x="12" y="292" font-weight="600">What chartbook lineage checks, edge by edge</text>
    <text x="12" y="314">a.  Each snapshot the lockfile names is in the store.</text>
    <text x="12" y="332">b.  Each file it holds hashes to the content hash recorded for it (every byte, with --rehash).</text>
    <text x="12" y="350">c.  The listing of those hashes, hashed again, is the pinned_hash the lockfile recorded.</text>
    <text x="12" y="368">d.  Each snapshot's own pins cover every dependency its manifest declares, so the walk continues upstream.</text>
    <text x="12" y="394" font-style="italic">Git puts one root hash over the whole history. ChartBook keeps a hash on every edge and checks them one by one.</text>
  </g>
</svg>
