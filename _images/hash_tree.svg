<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" width="620" height="330" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="currentColor" stroke="currentColor">
  <title>A hash tree over four files</title>
  <defs>
    <marker id="up" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" stroke="none"/>
    </marker>
  </defs>
  <g stroke="none">
    <!-- root -->
    <text x="310" y="33" text-anchor="middle" font-weight="600">Root hash</text>
    <text x="310" y="51" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5">hash(hash 0 + hash 1)</text>
    <!-- level 1 -->
    <text x="155" y="123" text-anchor="middle" font-weight="600">Hash 0</text>
    <text x="155" y="141" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5">hash(hash 0-0 + hash 0-1)</text>
    <text x="465" y="123" text-anchor="middle" font-weight="600">Hash 1</text>
    <text x="465" y="141" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5">hash(hash 1-0 + hash 1-1)</text>
    <!-- leaves -->
    <text x="77.5" y="213" text-anchor="middle" font-weight="600">Hash 0-0</text>
    <text x="232.5" y="213" text-anchor="middle" font-weight="600">Hash 0-1</text>
    <text x="387.5" y="213" text-anchor="middle" font-weight="600">Hash 1-0</text>
    <text x="542.5" y="213" text-anchor="middle" font-weight="600">Hash 1-1</text>
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5">
      <text x="77.5" y="231" text-anchor="middle">hash(file A)</text>
      <text x="232.5" y="231" text-anchor="middle">hash(file B)</text>
      <text x="387.5" y="231" text-anchor="middle">hash(file C)</text>
      <text x="542.5" y="231" text-anchor="middle">hash(file D)</text>
      <!-- files -->
      <text x="77.5" y="304" text-anchor="middle">A: rates.parquet</text>
      <text x="232.5" y="304" text-anchor="middle">B: returns.parquet</text>
      <text x="387.5" y="304" text-anchor="middle">C: chart.html</text>
      <text x="542.5" y="304" text-anchor="middle">D: README.md</text>
    </g>
  </g>
  <g fill="none" stroke-width="1.5">
    <rect x="215" y="14" width="190" height="46" rx="6"/>
    <rect x="60" y="104" width="190" height="46" rx="6"/>
    <rect x="370" y="104" width="190" height="46" rx="6"/>
    <rect x="5" y="194" width="145" height="46" rx="6"/>
    <rect x="160" y="194" width="145" height="46" rx="6"/>
    <rect x="315" y="194" width="145" height="46" rx="6"/>
    <rect x="470" y="194" width="145" height="46" rx="6"/>
    <g stroke-width="1.2" stroke-dasharray="5 3">
      <rect x="5" y="284" width="145" height="32" rx="6"/>
      <rect x="160" y="284" width="145" height="32" rx="6"/>
      <rect x="315" y="284" width="145" height="32" rx="6"/>
      <rect x="470" y="284" width="145" height="32" rx="6"/>
    </g>
  </g>
  <g stroke-width="1.3" marker-end="url(#up)">
    <line x1="77.5" y1="284" x2="77.5" y2="244"/>
    <line x1="232.5" y1="284" x2="232.5" y2="244"/>
    <line x1="387.5" y1="284" x2="387.5" y2="244"/>
    <line x1="542.5" y1="284" x2="542.5" y2="244"/>
    <line x1="77.5" y1="194" x2="135" y2="154"/>
    <line x1="232.5" y1="194" x2="175" y2="154"/>
    <line x1="387.5" y1="194" x2="445" y2="154"/>
    <line x1="542.5" y1="194" x2="485" y2="154"/>
    <line x1="155" y1="104" x2="285" y2="64"/>
    <line x1="465" y1="104" x2="335" y2="64"/>
  </g>
</svg>
